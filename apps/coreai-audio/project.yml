name: coreai-audio
options:
  bundleIdPrefix: com.daisukemajima
  createIntermediateGroups: true

# Depends on the CoreAIKit *library* (not raw coreai-models products). The library packages the
# swift-transformers / swift-crypto resource bundles so they code-sign cleanly on device — the
# self-contained raw-deps build hit "code object is not signed at all" on those bundles.
packages:
  # KitWhisperModel + KitASRModel (Whisper + Qwen3-ASR for the Transcribe tab).
  # DEV: local path so the uncommitted VoxCPM2TTS (Voice 2B tab) + ASR are live. Revert to the
  # url/revision below before committing.
  coreai-kit:
    path: ../../../../coreai-kit
  # coreai-kit (release pin):
  #   url: https://github.com/john-rocky/coreai-kit
  #   revision: 9f97c9fc0372ea9bfe60368122f9a1dd0406dc6e
  # On-device English G2P for free-text TTS (made for Kokoro; pulls in MLX for the
  # neural fallback on out-of-dictionary words).
  MisakiSwift:
    url: https://github.com/mlalma/MisakiSwift
    revision: 6835a1ce4a8854075c89f18ff75c74b13ef58e15
  # 8-speaker diarization for the Transcribe tab (Nemotron-3-Diarization host: mel, streaming loop,
  # speaker cache) and its gate metrics for DIARIZE_SELFTEST. Local package in this repo.
  NemotronDiarizer:
    path: ../../conversion/nemotron3_diar/swift

# Release: the engine's per-token host work is ~3x slower unoptimized.
schemes:
  coreai-audio:
    build:
      targets:
        coreai-audio: all
    run:
      config: Release

targets:
  coreai-audio:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources
        excludes:
          - KokoroAssets       # 3 .aimodel (321 MB) — downloaded from HF at runtime (dev: from disk)
          - KokoroResources    # added below as a folder-reference resource
          - VoxCPMAssets       # 5 bundles + glue + tokenizer (~1.3 GB) — dev symlink, loaded via #filePath
          - DotsAssets         # 4 bundles + glue + tokenizer (~4 GB) — dev symlink, loaded via #filePath
          - StableAudioAssets  # 3 bundles + t5_tokenizer + metadata (~1 GB) — dev symlink, loaded via #filePath
          - SeparateAssets     # mbr_full_fp16 bundle + metadata + golden_*.f32 (~0.5 GB) — dev symlink, loaded via #filePath
          - DiarizeAssets      # sortformer_float16 bundle + mel filters + golden_*.f32 + demo wav (~0.24 GB) — dev symlink, loaded via #filePath
          - N3DAssets          # n3d_streaming / n3d_offline bundles + 4 host .f32le + metadata (~0.8 GB) — dev symlink, loaded via #filePath
          - VibeVoiceAssets    # 6 .aimodelc bundles + device_bundle + golden.f32 (~2.8 GB) — dev symlink / iOS sideload, loaded at runtime
      - path: Sources/KokoroResources   # vocab/voices/l_linear/demo_phrases — bundled into the app
        type: folder
    dependencies:
      - package: coreai-kit
        product: CoreAIKit
      - package: coreai-kit
        product: CoreAIKitVision
      - package: MisakiSwift
        product: MisakiSwift
        embed: true
        link: true
      - package: NemotronDiarizer
        product: NemotronDiarizer
      - package: NemotronDiarizer
        product: N3DGateSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daisukemajima.coreaiaudio
        DEVELOPMENT_TEAM: MFN25KNUGJ
        CODE_SIGN_STYLE: Automatic
        # The 3.9 GB decoder cold-loads past the default jetsam limit on iPhone.
        CODE_SIGN_ENTITLEMENTS: coreai-audio.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "coreai-audio sends audio you record or choose to a local audio-understanding model on this device. Nothing leaves your device."
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
