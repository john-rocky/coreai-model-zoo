[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coreai-cli"
version = "0.1.0"
description = "Router, lint and gates for porting models to Apple's Core AI stack. Community tool, not an Apple product."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Daisuke Majima", email = "rockyshikoku@gmail.com" }]
keywords = ["coreai", "coreml", "apple-silicon", "on-device", "llm", "ane"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
hf = ["huggingface_hub"]

[project.urls]
Repository = "https://github.com/john-rocky/coreai-model-zoo"
Documentation = "https://github.com/john-rocky/coreai-model-zoo/tree/main/cli"
Changelog = "https://github.com/john-rocky/coreai-model-zoo/blob/main/cli/CHANGELOG.md"
Development = "https://github.com/john-rocky/coreai-model-zoo/blob/main/cli/DEVELOPMENT.md"

[project.scripts]
coreai = "coreai_cli:main"

[tool.setuptools]
py-modules = [
    "coreai_cli",
    "coreai_export",
    "coreai_doctor",
    "coreai_verify",
    "coreai_eval",
    "coreai_zoo_routes",
]
