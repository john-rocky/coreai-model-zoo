# Weight-only INT8, symmetric, PER-BLOCK-32 (block along the input dim, axis resolved by the
# quantizer per module type; no clipping). Ships BOTH the 1B (since 2026-09-09) and the 2B.
# The per-channel sibling (minicpm5_int8sym.yaml) shipped the 1B before that: its LM head is
# dead from vocab id ~65024 up through the engine (it never emitted <|im_end|>), and on the 2B
# it flips a 0.245-margin greedy decision that fp16 reproduces exactly. Same recipe, finer
# scale granularity, no dead rows. SDPA/RoPE/RMSNorm stay full precision.
quantization_config:
  execution_mode: eager
  global_config:
    op_state_spec:
      weight:
        dtype: int8
        qscheme: symmetric
        granularity:
          type: per_block
          block_size: 32
    op_input_spec: null
    op_output_spec: null
  module_type_configs:
    coreai_models.primitives.macos.sdpa.SDPA: null
    coreai_models.primitives.macos.rope.RoPE: null
    coreai_models.primitives.macos.rms_norm.RMSNorm: null
    coreai_models.primitives.macos.rms_norm.RMSNormPlusOne: null
