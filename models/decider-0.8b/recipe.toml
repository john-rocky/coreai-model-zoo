  "Gate = probability parity vs the author's fp32 readout on 44 fixture rows",
  "(conversion/decider/): letter argmax 44/44, max |dp| 0.0084, mean of row means 0.00067,",
  "engine argmax 44/44; bar 0.02 / 0.002. M4 Max decode 193.6 tok/s (see the card's caveat).",
