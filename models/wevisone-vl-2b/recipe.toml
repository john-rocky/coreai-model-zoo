# Recipe for wevisone-vl-2b — the configuration that produced each graph staged for mlboydaisuke/WeVisOne-VL-2B-CoreAI.
# Schema and the rules for `status`: ../README.md. Run it with:  python3 ../../conversion/zoo_convert.py run <name>
#
# A cut-out request needs all four graphs. The decoder and the tower are the zoo's Qwen3-VL exporter
# (conversion/export_qwen3_vl_pipelined.py) driven by conversion/wevisone/; the mask decoder is restructured in
# conversion/wevisone/mask/mask_graph.py. conversion/wevisone/README.md lists the oracle, the exports, the AOT compiles
# and the gates in order. Each staged .aimodel is its export with the MLIR debug locations stripped
# (conversion/wevisone/strip_stage.py: AIModelAsset.load -> strip_debug_info -> save_asset with the source's metadata,
# the method of conversion/d1_omni/strip_ship.py), which gives the staged main.mlirb of all four byte for byte from the
# 2026-10-24 exports (exports/r2/); the macOS AOT is compiled from the stripped .aimodel. The exporter names its externalized composites
# and resources anew on every export, so a new export equals the staged graph in weights and ops, not in bytes.
# zoo_convert.py runs every step in conversion/; from there ../../_wevisone is the work directory under the default work
# root (conversion/_paths.py: the repository's parent). The recipes write to ../../_wevisone/exports/ship/, apart from
# the 2026-10-24 exports (exports/r2/) the staging was made from (mask_vision_taps.py replaces an existing output folder).

["wevisone-vl-2b"]
script = "wevisone/mask/mask_hidden.py"
args = ["int8hu-pf64", "--out-root", "../../_wevisone/exports/ship/hidden", "--record", "../../_wevisone/exports/ship/hidden_export_int8hu-pf64.json"]
card = "README.md"
hf_repo = "mlboydaisuke/WeVisOne-VL-2B-CoreAI"
source_hf_id = "tencent/WeVisOne-VL-2B"
source_revision = "3dad9ce8bcb6fbe0aea945bf8860bd2cfc3663bf"
bundle = "ios/wevisone_vl_2b_decode_int8hu_pf64"
status = "verified"
overlay = true
runtime_patches = []
needs = [
  "The source snapshot at 3dad9ce8bcb6fbe0aea945bf8860bd2cfc3663bf in the Hugging Face cache with refs/main naming it",
  "(the exporter's loaders read the default branch; export_wevisone.py asserts it and sets HF_HUB_OFFLINE=1). The",
  "overlay venv (coreai-core 1.0.0b2, coreai-torch 0.4.1, coreai-opt 0.2.1, torch 2.9.0, transformers 4.57.6) and",
  "Xcode 27.0 RC as DEVELOPER_DIR for the AOT and strip_stage.py.",
]
aot = "xcrun coreai-build compile wevisone_vl_2b_decode_int8hu_pf64.aimodel --output <dir> --platform macOS --preferred-compute gpu --architecture h16c --expect-frequent-reshapes"
notes = [
  "The decoder with a second output: the overlay's Qwen3-VL pipelined decoder returning (logits, last_hidden), the last",
  "layer's output before the final norm (what the package's LastHiddenCapture reads at each <OBJ>). The exporter call is",
  "export_wevisone.py's: --grid 14 --max-ctx 4096 --skip-vision --skip-dynamic --skip-s1 --prefill-chunk 64, i.e. main",
  "S=1 + prefill S=64 sharing keyCache / valueCache [28, 1, 8, -1, 128]; int8hu = the body linears int8 per block of 32",
  "symmetric_with_clipping, the untied head int8 per block of 32 absmax; the checkpoint's tokenizer.json,",
  "tokenizer_config.json and chat_template.jinja copied byte for byte. The staged graph came from the 2026-10-24 export",
  "(exports/r2/hidden/int8hu-pf64/ under the work root): .aimodel 2,456,047,997 B, 2,467,662,022 B with metadata.json",
  "and tokenizer/; stripped .aimodel 2,455,690,498 B, main.mlirb 2,455,690,361 B, sha256",
  "f62a162875ab9411a8d3c24d5173b91e2a76f7f244adf4d8c287026ea75bc94e.",
  "Gates vs the package's fp32 reference on the fixed 448 grid (33 rows, Mac AOT h16c, Python runtime): A 33/33, B 33/33,",
  "D (16 teacher-forced steps at cosine >= 0.9999 each) 0/33 with the lowest step 0.99581 (record GATE.md); the logits",
  "equal the one-output bundle's bit for bit on 10 rows at every step; the <OBJ> states' cosine to the reference's",
  ">= 0.99863 (record r2/hidden_int8hu-pf64.json).",
  "Published 2026-10-27 as revision c370b50f3f4ef7e580c97ec72ccd7379683af5ee: all 53 files match the staged SHA256SUMS",
  "(LFS sha256 from the Hub, the small files downloaded and hashed; record r10/hf_readback.txt).",
]
open_questions = [
  "The decoder's bar D: the maintainer chose (2026-10-25) to ship the int8 decoder on A, B and the task suite with D",
  "recorded as measured (the card's Decoder accuracy section; record LANE.md section 3-7).",
]

