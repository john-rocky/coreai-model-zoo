  "main.mlirb 1,755,556,786 B (c5473e4c...); stripped 1,754,028,891 B, main.hash",
  "b2fe3868df8aba9beeb3c18db004fce520dedba39a7029d5ff0f420575d65c84, the same 138,196 ops (33 kinds). Its h19p compile:",
  "209.8 s, 30/30 transformer functions in a Neural Engine region, no ANECCompileOffline failure, .aimodelc",
  "2,146,054,948 B, main.hash c55b16c3c83ac30b274fc8bed4d6075d5b25618dc1c43c6f34536a2bcc480a9c, resources.bin",
