# Recipe for lfm3-1.7b — the configuration that produced the staged Mac bundle and rebuilds the iPhone 18 Pro's (the
# staged ios-h19p/ came from the lane's scripts with the same exporter, strip and compile command: open_questions).
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>
#
# The decoder is the LFM3 authoring module (coreai_models/models/macos/lfm3.py: 13 short-conv layers and 11 attention
# layers, the sliding window inside the SDPA composite, the zero-tail rotary, the output gate) exported for the
# pipelined engine by conversion/export_lfm3_decode_pipelined.py as one asset with two functions: "main" (one token)
# and "prefill" (a static 64-token chunk, --prefill-chunk 64). The staged .aimodel is that export with the MLIR debug
# locations stripped (coreai-torch 0.4.1 strip_debug_info: AIModelAsset.load -> strip_debug_info(program) ->
# program.save_asset; conversion/d1/strip_bundle.py does it), which has its own main.hash; the notes give both.
# The iPhone bundle is the static Neural Engine form (coreai_models/models/ios/lfm3.py through Apple's iOS export
# functions, conversion/export_lfm3_ane_static.py: 8-bit k-means g32, max context 4096), stripped the same way and
# compiled for the iPhone 18 Pro's Neural Engine (h19p); step 6, conversion/ios_device_bundle.py, runs that compile (the
# staged bundle was compiled by the lane's script with the same command).
# Status stays "unverified" until the bundles are published and their revision pinned.
#
# Step 1 writes the bundle's chat template from the vendor's (conversion/lfm3_chat_template.py), step 2 exports with
# it, step 3 strips: the Mac bundle. Step 4 exports the static form with the same template, step 5 strips it (keeping
# the export's asset metadata: author, licence, description), step 6 compiles it for h19p into the iPhone bundle.
# zoo_convert.py runs every step in conversion/, so the paths are relative to it: every file goes to
# ../../coreai-models/exports, the exports directory of the coreai-models checkout beside this one.

["lfm3-1.7b"]
steps = [
  { script = "lfm3_chat_template.py", args = ["../../coreai-models/exports/lfm3-1.7b.chat_template.jinja"] },
  { script = "export_lfm3_decode_pipelined.py", args = [
      "int8hu", "--head-quant", "block32", "--head-sym", "--prefill-chunk", "64",
      "--src", "LiquidAI/LFM3-1.7B", "--revision", "ac2586a34f1a1c03329dbdcdefabd8b6478ddaa7",
      "--hf-id", "LiquidAI/LFM3-1.7B", "--max-ctx", "4096",
      "--chat-template", "../../coreai-models/exports/lfm3-1.7b.chat_template.jinja",
      "--out-dir", "../../coreai-models/exports",
  ] },
  { script = "d1/strip_bundle.py", args = [
      "../../coreai-models/exports/lfm3_1_7b_decode_int8hu_block32_sym_pf64",
      "../../coreai-models/exports/ship/lfm3_1_7b_decode_int8hu_block32_sym_pf64",
  ], bundle = "gpu-pipelined/lfm3_1_7b_decode_int8hu_block32_sym_pf64" },
  { script = "export_lfm3_ane_static.py", args = [
      "--src", "LiquidAI/LFM3-1.7B", "--revision", "ac2586a34f1a1c03329dbdcdefabd8b6478ddaa7",
      "--hf-id", "LiquidAI/LFM3-1.7B", "--tokenizer-src", "LiquidAI/LFM3-1.7B",
      "--chat-template", "../../coreai-models/exports/lfm3-1.7b.chat_template.jinja",
      "--max-context-length", "4096", "--name", "lfm3_1_7b_static_pal8_tanh_block_c4096",
      "--out-dir", "../../coreai-models/exports",
  ] },
  { script = "d1/strip_bundle.py", args = [
      "../../coreai-models/exports/lfm3_1_7b_static_pal8_tanh_block_c4096",
      "../../coreai-models/exports/ship/lfm3_1_7b_static_pal8_tanh_block_c4096", "--keep-asset-metadata",
  ] },
  { script = "ios_device_bundle.py", args = [
      "../../coreai-models/exports/ship/lfm3_1_7b_static_pal8_tanh_block_c4096",
      "../../coreai-models/exports/ios-h19p", "--arch", "h19p", "--expect-regions", "30",
  ], bundle = "ios-h19p" },
]
card = "README.md"
hf_repo = "mlboydaisuke/LFM3-1.7B-CoreAI"
source_hf_id = "LiquidAI/LFM3-1.7B"
source_revision = "ac2586a34f1a1c03329dbdcdefabd8b6478ddaa7"
bundle = "gpu-pipelined/lfm3_1_7b_decode_int8hu_block32_sym_pf64"
status = "unverified"
overlay = true
runtime_patches = ["apps/coreai-pipelined-extra-states.patch", "apps/coreai-shared-product.patch"]
runtime_env = { COREAI_CHUNK_THRESHOLD = "1" }
needs = [
  "The overlay venv (coreai-core 1.0.0b2, coreai-torch 0.4.1, coreai-opt 0.2.1, torch 2.9.0, transformers 4.57.6); the",
  "LFM3 modules come with conversion/overlay/ (files/python/src/coreai_models/models/{macos,ios}/lfm3.py), and",
  "transformers 4.57.6 has no lfm3, so the module reads the safetensors itself.",
  "The gates ran llm-runner built from the zoo's coreai-models fork (john-rocky/coreai-models, branch zoo-0.2 at",
  "661a5d4; its pipelined engine carries the extra state) with Xcode 27.0 RC, after dropping one argument label that the",
  "RC SDK rejects (CoreAILanguageModel.swift:51).",
  "Step 6 compiles with Xcode 27.0 RC's coreai-build (3600.83.1; export_lfm3_ane_static.aot sets DEVELOPER_DIR to",
  "/Applications/Xcode-27.0.0-RC.app/Contents/Developer). The iPhone bundle is never loaded on the Mac; its checks ran",
  "on an iPhone 18 Pro (iOS 27.2) through CoreAIKit's pinned engine (the fork's tag 0.2.8-zoo, StaticShapeEngine).",
]
aot = "Mac: not shipped. The Mac loads the .aimodel and specializes it on first load (the kit's path); in one window it decoded 169.5 tok/s against 105.5 for the AOT. The Mac gates ran that AOT: xcrun coreai-build compile <name>.aimodel --output <dir> --platform macOS --preferred-compute gpu --architecture h16c --expect-frequent-reshapes. iPhone 18 Pro: shipped as ios-h19p/ (step 6: --platform iOS --preferred-compute neural-engine --architecture h19p; no --expect-frequent-reshapes, every function is static)."
