open_questions = [
  "A re-export does not reproduce the published main.hash (5d4b6a89…): each export draws new random names for its 9 externalized graphs (coreai-torch 0.4.1, externalize.py uuid4().hex[:8]) and its 364 weight resources (64-bit decimal numbers, so their length changes too). Checked 2026-10-30 on four re-exports from a fresh clone of the overlay's base, the stripped main.mlirb section by section: the header and every section but the string section are byte-equal (the weights included), and the string section holds the same strings in the same order once those names are replaced (each file's size entries and section length checked against its strings); the 3,971 ops are the same.",
  "The staged ios-h19p/ was built before steps 4-6 were written here, by the lane's scripts: the same exporter and builder before their emit_hidden switch (on the tiny model, the builder here with the switch off exports the same torch programs for all four functions as the earlier one; the 1.7B was not compared that way), a strip that kept the asset metadata as step 5 does, and step 6's compile command. Steps 4-6 have not been re-run against it yet; a re-run is expected to draw new names as the Mac export does (not yet checked for this form), so it will be compared by its Neural Engine programs and resources.bin, not by main.hash.",
  "The iPhone 17 Pro has no bundle: the same static form compiled for h18p passed the same checks on Apple's engine, but CoreAIKit's path has not run on that phone (knowledge/lfm3-1.7b-port.md, iPhone).",
]
