# Recipe for minicpm5-1b — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["minicpm5-1b"]
script = "export_minicpm5.py"
args = ["--qconfig", "minicpm5_int8sym_b32.yaml"]
card = "README.md"
hf_repo = "mlboydaisuke/MiniCPM5-1B-CoreAI"
source_hf_id = "openbmb/MiniCPM5-1B"
bundle = "int8"
status = "verified"
overlay = true
needs = [
  "Two one-time coreai_models edits documented in export_minicpm5.py: registry",
  "MODEL_TYPE_REMAPPING llama -> mistral, and an AIModelMetadataFields entry for",
  "openbmb/MiniCPM5-1B. Both belong in conversion/overlay/ but are not there yet.",
]
notes = [
  "This wrapper is the recipe: it runs the stock exporter as",
  "`uv run coreai.llm.export openbmb/MiniCPM5-1B --experimental --compute-precision float16",
  "--compression-config minicpm5_int8sym_b32.yaml` (int8 symmetric PER-BLOCK-32, the 2B's yaml),",
  "then rewrites the bundle's eos_token to <|im_end|> (the engine stops on a single eosTokenId).",
  "The per-channel yaml (minicpm5_int8sym.yaml) shipped this model until 2026-09-09 as HF rev",
  "5ad650f: its LM head was dead from vocab id ~65024 up, <|im_end|> included, so a chat turn",
  "never halted (knowledge/minicpm5-1b.md, 2026-09-09 section). Gate a rebuild with",
  "`cli/coreai_verify.py <bundle> --chat no-think --prompt '1+1=?' -n 16 --must-stop-within 16`.",
  "Plain LlamaForCausalLM, so it rides the stock exporter rather than a pipelined script.",
]
