# Recipe for laya-multilingual — the configuration that produces each bundle folder.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>
#
# Every entry assumes the oracle has run first in its own environment (`needs` below) and that the
# authoring gate passed its row gate and negative controls for the window: conversion/laya/README.md
# lists the stages in order. Which precision is published is not decided yet (status "unverified").

["laya-multilingual"]
card = "README.md"
hf_repo = "mlboydaisuke/Laya-Multilingual-CoreAI"
source_hf_id = "convaiinnovations/laya"
status = "unverified"
steps = [
  { script = "laya/gate_laya_authoring.py", args = ["--window", "256", "--negative-controls"] },
  { script = "laya/gate_laya_authoring.py", args = ["--window", "512", "--negative-controls"] },
  { script = "laya/export_laya.py", args = ["--window", "256", "--dtype", "wfp16", "--target", "macos", "--accept-layer-gate-finding"], bundle = "macos/wfp16-s256/laya_ml_wfp16_s256.aimodel" },
  { script = "laya/export_laya.py", args = ["--window", "512", "--dtype", "wfp16", "--target", "macos", "--accept-layer-gate-finding"], bundle = "macos/wfp16-s512/laya_ml_wfp16_s512.aimodel" },
  { script = "laya/export_laya.py", args = ["--window", "256", "--dtype", "fp32", "--target", "macos", "--accept-layer-gate-finding"], bundle = "macos/fp32-s256/laya_ml_fp32_s256.aimodel" },
  { script = "laya/export_laya.py", args = ["--window", "512", "--dtype", "fp32", "--target", "macos", "--accept-layer-gate-finding"], bundle = "macos/fp32-s512/laya_ml_fp32_s512.aimodel" },
]
needs = [
  "Stage 0 first, in its own environment: `uv run --python 3.12 conversion/laya/oracle_laya.py` (Python >= 3.12,",
  "torch 2.12.1, transformers 5.17.0, laya 0.3.4 from the script header; the zoo venv's transformers 4.57.6",
  "cannot read this encoder's v5 config). It writes the oracle dumps and results/oracle.json the gates read.",
  "The frozen fixtures of the LiteRT lane in <work>/laya-multilingual/fixtures/ (sha256-pinned in _common.py)",
  "and its captures in <work>/laya-multilingual/oracle-litert/.",
]
notes = [
  "One multifunction JIT .aimodel per folder: `main` (input_ids / attention_mask int32 [1,S], qtype_onehot",
  "[1,3] -> token_logits [1,S], pooled_cls [1,768]) and `act` (pooled_cls, feats [1,4] -> act_logits [1,2], fp32).",
  "wfp16 = fp16 weight storage with fp32 compute (the checkpoint is F16, so the stored weights are exact);",
  "fp32 is the reference. The fp16 recipe (fp16 compute) misses the answer bar in torch and is built only",
  "with --measure-only, marked FAIL.",
  "--accept-layer-gate-finding: the authoring layer gate (1e-4) fails from layer 10/11 on, where the official",
  "model's own SDPA-vs-eager distance already exceeds 1e-4 (CLS carries a ~1.4e4 activation); the export",
  "manifest records the override. The row gate, pad isolation and all five negative controls pass.",
  "Upstream revision 1c5edc17a7acd8701df6fc341c0d179f1c62c982 (subfolder multilingual) is pinned in",
  "conversion/laya/_common.py and verified by sha256 on every load.",
  "Runtime gate (not a recipe step): gate_laya_runtime.py <folder> --compute cpu_only|gpu|neural_engine;",
  "results merge into provenance/runtime-gate.json.",
]
open_questions = [
  "Which precision(s) and windows ship, and whether the 1e-4 layer bar is replaced — supervisor decision.",
  "GPU and Neural Engine runtime gates not run yet (round 1 was cpu_only).",
]

["laya-multilingual-ios"]
card = "README.md"
hf_repo = "mlboydaisuke/Laya-Multilingual-CoreAI"
source_hf_id = "convaiinnovations/laya"
status = "unverified"
steps = [
  { script = "laya/export_laya.py", args = ["--window", "256", "--dtype", "wfp16", "--target", "ios"], bundle = "ios/wfp16-s256/laya_ml_wfp16_s256.aimodel" },
  { script = "laya/export_laya.py", args = ["--window", "512", "--dtype", "wfp16", "--target", "ios"], bundle = "ios/wfp16-s512/laya_ml_wfp16_s512.aimodel" },
]
notes = [
  "A byte-identical copy of the gated macos/ folder (the portable JIT bundle; the manifest records the source",
  "hashes). Never loaded on a Mac. No iPhone measurement exists yet; the h18p AOT is a later stage.",
]
open_questions = [
  "Device gate on the iPhone 17 Pro not run (device not connected 2026-09-23).",
  "Whether the phone JIT keeps the fp16 weight constants or folds the casts (the Mac converter keeps them).",
]
