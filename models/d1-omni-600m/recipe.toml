# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>
#
# LiquidAI/d1-omni-600M re-authored from model.safetensors at 414f8d6438174f5b2133a9c21a478fc42625e308 as three plain
# PyTorch graphs (conversion/d1_omni/d1_omni_model.py, d1_omni_vision.py, d1_omni_audio.py), exported in fp16, their
# debug locations stripped, compiled ahead of time, and gated against the publisher's own model in fp32 on the CPU.
# conversion/d1_omni/README.md lists every stage in this order, with the gate of each.

