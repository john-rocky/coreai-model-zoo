aot = "xcrun coreai-build compile <stem>.aimodel --output <dir> --platform macOS --preferred-compute gpu --architecture h16c (Mac); --platform iOS --min-deployment-version 27.0 --preferred-compute gpu --architecture h19p (iPhone 18 Pro). No --expect-frequent-reshapes: every graph is static."
notes = [
  "Graphs (fp16 weights and compute; the exceptions in each metadata.json): decision `main` at L = 64 / 128 / 256 /",
  "512 / 1024 / 2048 / 4096 (input_ids int32 [1, L], prefix_embeds [1, L, 1024], pad_mask / prefix_mask / keep_right",
  "[1, L], qtype_onehot [1, 3] -> scores [1, L]; L4096 computes attention in two blocks of 2,048 keys); vision",
  "`main` (one crop: pixel_values / pos_embed [1, 1024, 768], patch_mask [1, 1024], unshuffle_index int32 [256, 4] ->",
  "prefix [1, 256, 1024]); audio `main` per clip bucket of 5 / 10 / 20 / 30 s (mel [1, 128, F] and four time masks ->",
  "prefix [1, T, 1024]). The host (conversion/d1_omni/host.py; apps/D1Omni in Swift) builds the rows, the media",
  "inputs and the mel, picks the smallest bucket that holds the row, reads scores at the markers and applies the",
  "publisher's temperatures and softmax.",
  "Published bundle bytes (stripped .aimodel / h19p .aimodelc): decision 761,631,060 to 762,676,555 / 761,747,067 to",
  "762,255,228 (L64 to L2048: ios-h19p/ has no L4096); vision 188,218,374 / 188,303,983; audio 224,920,212 to",
  "225,561,282 / 225,226,318 to 225,867,256 (<work>/_d1_omni/hf_staging/d1-omni-600M-CoreAI/metadata.json `staged`).",
  "ios/ holds the same .aimodel files as macos/; each phone specializes them at load.",
  "Gates against the publisher's model in fp32 on the CPU (FACTS §7: argmax on every row whose oracle top-2 margin is",
  "above 0.02, max |dp| 0.02, mean of the rows' max |dp| 0.002): gate-d1-omni-600m-runtime-decide.json (L64 ... L4096),",
  "-runtime-vision.json, -runtime-audio.json, -swift.json, -strip.json; the torch module before any export:",
  "-eager.json; every form measured (fp32, wfp16, fp16, int8, the Neural Engine): -forms.json; time per decision on the",
  "Mac: -timing-mac.json; the iPhone 18 Pro (apps/D1OmniGate, the .aimodel and the h19p compiles): -iphone.json.",
  "zoo_transcripts.py --check rebuilds them and records the result in <work>/_d1_omni/results/zoo_fixtures_check.json.",
  "Not a step: the L1024 probe (no fixture row has 513-1024 positions; one request through the Swift host against the",
  "Python runtime, a lane script), the timing windows (timing_run.py window under quiet_hold.py, gate_swift.py window",
  "/ media-window; their records are in -timing-mac.json) and the device round (apps/D1OmniGate: _fixtures.py, _stage.sh,",
  "_gate.sh on a connected iPhone 18 Pro; its records are in -iphone.json).",
]
