  "Pass bars: fp32 forms L2 (MASE and CRPS within 0.1 % of the released forecaster's, every fixture group and overall);",
  "fp16 / Neural Engine forms L3 (<= 1.010 x, no NaN / inf, monotone).",
  "Scope: one univariate series, no covariates, one decode block (<= 1,024 steps), context <= 8,192 steps.",
  "Published: mlboydaisuke/Timestral-209M-CoreAI revision 5d1713f56f7867c54214c95f9d4c280a2859c7e5 (2026-10-23);",
