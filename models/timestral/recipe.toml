notes = [
  "Graph: patches [R, L, 64], cos / sin [L+h, 64], attn_mask [1, 1, L+h, L+h] (1 = attend) -> quantiles [R, h*32, 21],",
  "monotone, in the normalized space of the last context patch; the host (conversion/timestral/host_forecast.py) does",
  "the float64 statistics, the asinh, the refine frame, the cap, symmetric averaging and the clip.",
  "Buckets: L64 h32 = context <= 2,048 steps and horizon <= 1,024; L64 h4 = horizon <= 128; L256 h32 = context <= 8,192.",
  "Per device the passing form with the lowest latency (SPEED_LADDER): the Mac (Swift runtime) = the ane form R1 / ane h4 R2 / GPU",
  "fp16-attn32 L256; the iPhone 18 Pro = the ane form R2 / ane h4 R2 / ane L256 R1, as the h19p compiles. The h4 bundle is",
  "the same file in macos/ and ios/.",
  "The ane form (timestral_ane.py) runs on the Neural Engine only: its attention scores are fp16, and the same graph on",
  "the GPU saturates at +-65,504. fp16-attn32 = fp16 compute with the attention scores and softmax in fp32 (the scores",
  "reach 2.4e5 on the fixture). The bundle names carry the form: fp16p7-qkv4-tanh-conv = the ane form.",
  "Hub bytes: ios/, ios-h19p/ and the h4 bundle that macos/ shares with ios/ are the bundles measured on the iPhone 18 Pro",
  "(an earlier export of the same graph); the other two macos/ bundles were rebuilt by these steps.",
  "An export is not byte-reproducible: the same command twice gives a different main.hash. The rebuilt bundles were run",
  "again on every fixture window on the Mac: their outputs equal the measured bundles' bit for bit (10 forms;",
