["embeddinggemma-2-transcribe-macos-encoder-split7"]
card = "README.md"
hf_repo = "mlboydaisuke/EmbeddingGemma-2-Transcribe-CoreAI"
source_hf_id = "google/embeddinggemma-2"
status = "verified"
steps = [
  { script = "eg2_transcribe/split_encoder.py", args = ["export", "--part", "front", "--stage", "layer7", "--bucket", "3000", "--aot", "gpu"], bundle = "macos-encoder-split7-30s/eg2_front_layer7_fp32_T3000.aimodel" },
  { script = "eg2_transcribe/split_encoder.py", args = ["export", "--part", "body", "--stage", "layer7", "--bucket", "3000", "--aot", "neural-engine"], bundle = "macos-encoder-split7-30s/eg2_body_layer7_fp16_T3000.aimodel" },
]
needs = [
  "What [embeddinggemma-2-transcribe] needs: the checkpoint at 914f7f89 (EG2_MODEL_DIR or the Hugging Face cache),",
  "the fixtures (EG2_FIXTURES, for the export's torch check and the gate), the zoo venv, and Xcode 27 with coreai-build",
  "3600.83.1 for the --aot compiles (h16c: the GPU front and the Neural Engine body that the gate and the timing load).",
]
notes = [
  "A second form of the encoder of [embeddinggemma-2-transcribe], for running the encoder alone on long audio on a",
  "Mac: the same graph cut in two after conformer layer 7. Front = subsampling + layers 0-7 in float32, features",
  "[1,3000,128] + half_mask [1,1500] -> hidden [1,750,1024], loaded with the GPU preferred. Body = layers 8-11 +",
  "embed_audio in float16 (max-abs RMSNorm), hidden [1,750,1024] -> soft_tokens [1,750,512], loaded with the Neural",
  "Engine preferred (its h16c Neural Engine AOT compile has 1 ANE region). The host casts hidden to float16 between",
  "the two calls.",
  "Two windows in flight: the front of window i+1 issued together with the body of window i (two bundles; never two",
  "calls of one bundle's function at once). Mac M4 Max, macOS 27.0 26A428, the h16c AOT compiles: 30.96 ms per 30 s",
  "window over 20 windows in a row (x969) against 40.04 ms for the one-bundle fp16 encoder in the same measurement",
  "window; one window alone 57.40 ms. Gate (gate_encoder.py --front --body --backend ane --pipeline): 20/20 clips,",
  "per-token cosine min 0.99671, the two-in-flight soft tokens bit-identical to the sequential pass.",
  "Not for the iPhone: on the iPhone 18 Pro the body is placed on the GPU with the Neural Engine preferred, its Neural",
  "Engine AOT h19p fails to load (failedToSpecialize), and the float32 front alone takes 124.4 ms per window, so the",
  "pair is slower than the one-bundle encoder there. The HF repo has it in macos-encoder-split7-30s/ only, a root",
  "folder, so an app that downloads macos/* does not fetch it.",
  "The published bundles are these exports with their MLIR debug locations removed by strip_ship.py's strip function",
  "(strip_one, with the two bundles added to its SOURCES): op counts and inspect summaries unchanged; on the Mac their",
  "hidden states and soft tokens are bit-identical to the gated bundles and to the h16c AOT compiles on the 20",
  "fixture clips.",
]
open_questions = [
  "strip_ship.py strip takes only the one-bundle encoder and the reader: the strip of these two is in notes, not steps.",
]
