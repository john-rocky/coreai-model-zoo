# Recipe for embeddinggemma-2-transcribe — the configuration that produced each staged bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>
#
# The EmbeddingGemma 2 audio encoder (Gemma 4 audio tower + embed_audio), re-authored from model.safetensors at
# 914f7f89142e33e77833254d9c9b90c3cef7303b, and reader v1 with its 200,000-word table, as two static fp16 graphs for
# 30 s windows. Steps 1-3 build and check the graphs, step 4-5 strip their debug locations into the published
# copies. conversion/eg2_transcribe/README.md lists the gates and the timing runs in order.

["embeddinggemma-2-transcribe"]
card = "README.md"
hf_repo = "mlboydaisuke/EmbeddingGemma-2-Transcribe-CoreAI"
source_hf_id = "google/embeddinggemma-2"
status = "verified"
steps = [
  { script = "eg2_transcribe/parity_encoder.py", args = ["parity"] },
  { script = "eg2_transcribe/export_encoder.py", args = ["--form", "fp16", "--bucket", "3000", "--aot", "gpu,neural-engine"] },
  { script = "eg2_transcribe/export_reader.py", args = ["--form", "fp16", "--tokens", "750", "--aot", "gpu,neural-engine"] },
  { script = "eg2_transcribe/strip_ship.py", args = ["strip", "--only", "eg2_audio_fp16_T3000"], bundle = "macos/eg2_audio_fp16_T3000.aimodel" },
  { script = "eg2_transcribe/strip_ship.py", args = ["strip", "--only", "eg2_reader_fp16_T750"], bundle = "macos/eg2_reader_fp16_T750.aimodel" },
]
needs = [
  "The checkpoint: `hf download google/embeddinggemma-2 --revision 914f7f89142e33e77833254d9c9b90c3cef7303b`, found",
  "through EG2_MODEL_DIR or the Hugging Face cache (export_encoder.py checks model.safetensors by sha256).",
  "The fixtures: the reader/fixtures directory of the eg2-transcribe repository (test-clean-20 with features.npy and",
  "soft_tokens.npy from transformers 5.19.0 with the default attention, long-speckled-band, MANIFEST.json), EG2_FIXTURES.",
  "Reader v1: the reader/ directory of the eg2-transcribe repository (train/model.py, train/decode.py, reader.pt,",
  "word_table.npy, vocab.txt, reader_config.json), EG2_READER_DIR; the four release files are also",
  "mlboydaisuke/EmbeddingGemma-2-Transcribe-Reader.",
  "The zoo venv: coreai-core 1.0.0b2, coreai-torch 0.4.1, torch 2.9.0, safetensors, numpy; Xcode 27 with coreai-build",
  "3600.83.1 for the --aot compiles (h16c, the gates' bundles).",
]
notes = [
  "Published 2026-10-14 as Hub revision a4b7895d7c03a1691e216975a06002e9cddb39ce (80 files: the Hub's lfs sha256 and sizes of the 11 bundles' large files and the downloaded small files match SHA256SUMS). Reader weights: mlboydaisuke/EmbeddingGemma-2-Transcribe-Reader revision 1af9c5f52991e90afe0ff5f792a135d6500bf3b3 (9 files, same check).",
  "Graphs: encoder features [1,3000,128] + half_mask [1,1500] -> soft_tokens [1,750,512]; reader soft_tokens",
  "[1,750,512] + token_mask [1,750] -> top1_index (int32), top1_logit, blank_logit [1,750]; float16 inputs, weights,",
  "arithmetic and outputs. ios/ in the HF repo holds the same bytes as macos/ (JIT .aimodel for every iPhone).",
  "Encoder float16: every RMSNorm divides its row by its max |x| before squaring (the residual stream reaches 383,",
  "its element-wise square overflows float16); the two subsampling LayerNorms stay plain (their max-abs variant fails",
  "the h16c Neural Engine compile). half_mask is the only mask: without it a window with n_frames % 4 == 2 gets a wrong",
  "last token. The reader graph holds the word table (float16 [200000, 768]) and the argmax; the host reads blank",
  "where blank_logit > top1_logit, merges repeats and drops blanks.",
  "Gates (Mac M4 Max, macOS 27.0 26A428, 2026-10-13/14): gate_encoder.py on the fp16 GPU AOT h16c bundle, 20/20 clips,",
  "per-token cosine min 0.99645; gate_reader.py on the fp16 GPU AOT h16c bundle, fixture 19/20 and test-clean (200",
  "utterances) WER 5.878 % = torch; bench_pipeline.py long: 3,257.4 s in 5.681 s with the reader on the Neural Engine",
  "and two windows in flight, WER 5.80 % (torch path 5.78 %). iPhone 18 Pro (iOS 27.2 24B5099f): the encoder JIT",
  ".aimodel 59.88 ms and its AOT h19p 59.60 ms per 30 s window, 20/20 clips, min 0.99626.",
  "An AOT bundle's main.hash does not include the weights and the Core AI cache is keyed by it: delete the cache entry",
  "after re-exporting a reader with new weights to the same path (conversion/eg2_transcribe/README.md, the cache).",
  "Steps 4-5 (strip_ship.py strip) remove the MLIR debug locations, which name the converting machine's files; the",
  "operations and the outputs are unchanged (strip_ship.py compare: bit-identical on the Mac). The published bundles are",
  "these copies; the gated originals stay in the work directory.",
  "Conversion is not byte-deterministic (the converter names resources at random): reproduction is judged by the gates.",
]
open_questions = [
]

