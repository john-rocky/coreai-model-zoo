# Recipe for d1-3B — the configuration that produced the staged bundles.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>
#
# A decision needs one decoder bundle; a picture adds the tower bundle. Two decoders ship, one per platform: the Mac runs
# the fp16 decoder (`d1-3b`), the iPhone the int8mlp decoder (`d1-3b-int8mlp`, the MLP linears int8). Both are this port's
# authoring (conversion/d1/lfm2_d1_decoder.py: the overlay's LFM2.5-VL text decoder, Lfm2VlPipelinedForCausalLM, with an
# identity head: the final-norm hidden state at every position of a static 64-token call, the image rows as a static
# input, the positions and the KV sequence axis dynamic) and carry the same contract. The exporter writes the option table
# (head/option_rows: the tied embedding rows of every readout candidate id) beside the graph; the host reads it. The tower
# is conversion/d1/lfm2_vl_tower.py (SigLIP2 + projector with the crop's grid as inputs, one call per crop).
# Each bundle ships as the export copied to a new name with the export's debug locations stripped (step 2,
# conversion/d1/strip_bundle.py: coreai-torch writes every op's source location, local paths included, into
# main.mlirb; the stripped graph's ops and weights are the same). conversion/d1/README.md lists the fixtures, the oracle
# and the gates in order.

["d1-3b"]
steps = [
  { script = "d1/export_decoder.py", args = ["fp16", "--prefill-chunk", "64", "--aot"] },
  { script = "d1/strip_bundle.py", args = ["../../_d1_3b/exports/bundles/d1_3b_decode_fp16_pf64", "../../_d1_3b/exports/bundles_ship/d1_3b_decode_fp16_pf64_s", "--aot"], bundle = "gpu-pipelined/d1_3b_decode_fp16_pf64_s" },
]
