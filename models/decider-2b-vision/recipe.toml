# Recipe for decider-2b-vision — the configuration that produced each staged bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>
#
# A decision needs one decoder and one tower. The decoder is this port's authoring
# (conversion/decider_vision/qwen3_5_vl_pipelined.py: ids in, the tower rows as a static input, M-RoPE in the
# graph); the towers are the overlay's qwen3_5_vision.py through the Qwen3.8-27B vision exporter with the grid
# and the dtype set. conversion/decider_vision/README.md lists the oracle and the gates in order.

["decider-2b-vision"]
script = "decider_vision/export_decoder.py"
args = ["int8mix", "--fp16-layers", "0,2,5", "--prefill-chunk", "16", "--aot"]
card = "README.md"
hf_repo = "mlboydaisuke/decider-2b-vision-CoreAI"
source_hf_id = "Mapika/decider-2b-vision"
source_revision = "863e290863655f1d6b69324d77d09ac972d21609"
bundle = "gpu-pipelined/decider_2b_vision_decode_int8mix_pf16"
status = "verified"
overlay = true
runtime_patches = []
needs = [
  "The source snapshot at 863e290863655f1d6b69324d77d09ac972d21609 in the Hugging Face cache; the script defaults",
  "HF_HOME to $ZOO_WORK_ROOT/_decider2bv/hf and sets HF_HUB_OFFLINE=1 / HF_HUB_DISABLE_XET=1.",
  "The overlay venv (coreai-core 1.0.0b2, coreai-torch 0.4.1, coreai-opt 0.2.1, torch 2.9.0, transformers 4.57.6)",
  "and, for --aot, Xcode 27.0 RC as DEVELOPER_DIR.",
]
aot = "xcrun coreai-build compile <name>.aimodel --output <dir> --platform macOS --preferred-compute gpu --architecture h16c --expect-frequent-reshapes"
notes = [
  "The ship decoder. The arguments are the logged run's (2026-09-29 02:04 JST, macOS 27.0 26A428, M4 Max); that",
  "run also passed --record <work>/_decider2bv/logs/r6_export_int8mix_pf16.json, which writes a log and does not",
  "change the bundle. Output: $ZOO_WORK_ROOT/_decider2bv/exports/bundles/<name>/; --aot adds",
  "bundles_aotc/<name>.h16c.aimodelc (10,176,020,956 B), which the Python gates load and which is not shipped.",
  "int8mix = every linear int8 per block of 32 (symmetric_with_clipping, weight only) except the 24 linears of",
  "layers 0, 2 and 5, which stay fp16; the tied embedding / head, conv1d and norms stay fp16. The layer set came",
  "from int8_bisect_torch.py on four fixture runs (rule: r29 |dp| <= 0.010, no run worse than int8lin, at most",
  "four layers, the smallest set). Two functions sharing the weights: main (S=1) and prefill (S=16, GDN unrolled).",
  "main.mlirb 2,644,272,749 B, sha256 a82f61ae00eb2b968072d45cb9abd71e2c079b6ec2e736b68721c706785bce75;",
  "metadata.json sha256 d134b009c4153a420150b4f87b00f1ca866c1277668d3976e1789019f59710fb.",
  "Gates vs the author's fp32 readout (bar max |dp| 0.02, mean of run means 0.002): decoder alone 157/157, max",
  "0.0094; end to end 98/98, max 0.0096; held out 497/497 + 3/3 near-ties, max 0.0146, mean 0.00144; Swift AOT",
  "108/108, max 0.0096; Swift JIT of the .aimodel 108/108, max 0.0103. iPhone not measured yet.",
  "No engine: both hosts drive the low-level runtime and read the logits at every slot. An engine run would need",
  "apps/coreai-pipelined-extra-states.patch and apps/coreai-pipelined-static-inputs.patch (four states, four static",
  "inputs) and COREAI_CHUNK_THRESHOLD=1; not tested here, and the pipelined engine returns no logits.",
  "Uploaded 2026-09-29, Hub revision 4948e3231035df85c7b03c90b766eb17a08d9451 (the bundle upload); all 24 files verified by size and sha256 after the upload.",
]

