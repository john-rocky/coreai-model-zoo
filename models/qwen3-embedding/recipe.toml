# Recipe for qwen3-embedding — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["qwen3-embedding-0.6b"]
script = "export_qwen3_embedding.py"
args = ["--dtype", "float16", "--seq-len", "512"]
card = "README.md"
hf_repo = "mlboydaisuke/Qwen3-Embedding-0.6B-CoreAI"
source_hf_id = "Qwen/Qwen3-Embedding-0.6B"
bundle = "qwen3-embedding-0.6b_float16_s512_static.aimodel"
status = "verified"
notes = [
  "Static sequence length is part of the graph contract; it is in the bundle name.",
  "Reproduced end to end on 2026-07-25 with `uv run` alone — no venv, no overlay: same bundle",
  "name, same file set, torch-ladder gates all passing (worst per-text cosine 1.000000).",
  "It is NOT byte-identical to the published bundle, and cannot be: two runs of this same",
  "command minutes apart differ from each other too (main.mlirb by 7 bytes, main.hash entirely).",
  "Conversion is not byte-deterministic, so reproduction is judged behaviourally, not by hash.",
]

["embeddinggemma-300m"]
script = "export_embeddinggemma.py"
args = ["--dtype", "float32", "--seq-len", "256"]
card = "README.md"
hf_repo = "mlboydaisuke/embeddinggemma-300m-CoreAI"
source_hf_id = "google/embeddinggemma-300m"
bundle = "model/embeddinggemma-300m_float32_static.aimodel"
status = "verified"
notes = [
  "The static sequence length is not in the bundle name, but the repo publishes it:",
  "model/reference.json says {\"model\": \"google/embeddinggemma-300m\", \"seq_len\": 256,",
  "\"dtype\": \"float32\"} — written by the exporter itself, so it is a record, not a default.",
]
